# Kıstas geliştirme ortamı.
# Flutter ve Android SDK kendi makinenizde neredeyse oraya bağlamak için
# aşağıdaki yorum satırlarını kendi yollarınızla düzenleyin.
services:
  kistas-dev:
    build:
      context: .
    volumes:
      - .:/app
      # - C:\src\flutter:/flutter        # Flutter SDK'nızın yolu
      # - C:\Android\sdk:/android-sdk    # Android SDK'nızın yolu
      - flutter-cache:/flutter/bin/cache
      - gemini-config:/root/.config/gemini
    environment:
      FLUTTER_ROOT: /flutter
      ANDROID_SDK_ROOT: /android-sdk
      ANDROID_HOME: /android-sdk
      PATH: /flutter/bin:/android-sdk/cmdline-tools/latest/bin:/android-sdk/platform-tools:/android-sdk/emulator:/android-sdk/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    stdin_open: true
    tty: true
    working_dir: /app

volumes:
  flutter-cache:
  gemini-config:
