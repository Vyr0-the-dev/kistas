name: kistas
description: "Kıstas Sınav Takip Uygulaması."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^17.1.2
  flutter_timezone: ^5.0.1
  file_picker: ^8.0.6
  google_fonts: ^6.2.1
  http: ^1.2.1
  path_provider: ^2.1.3
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  timezone: ^0.9.4
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.2
  home_widget: ^0.9.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.0.9
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  image_picker: ^1.1.2
  package_info_plus: ^8.0.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  path_provider_platform_interface: ^2.1.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#282a39"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  notification_icon: "assets/images/notification_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/