name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Google Maven Central mirror for CI reliability
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2"

          def patchRepos = { RepositoryHandler repos, boolean prioritizeMirror ->
            repos.all { ArtifactRepository repo ->
              if (repo instanceof MavenArtifactRepository) {
                def u = repo.url.toString()
                if (u.startsWith("https://repo.maven.apache.org/maven2") || u.startsWith("https://repo1.maven.org/maven2")) {
                  repo.url = uri(mirrorUrl)
                }
              }
            }
            if (prioritizeMirror) {
              def existing = repos.find { it instanceof MavenArtifactRepository && it.url.toString().startsWith(mirrorUrl) }
              if (existing != null) {
                repos.remove(existing)
                repos.addFirst(existing)
              } else {
                def m = repos.maven { url = uri(mirrorUrl) }
                repos.remove(m)
                repos.addFirst(m)
              }
            }
          }

          gradle.settingsEvaluated { settings ->
            patchRepos(settings.pluginManagement.repositories, true)
            if (!settings.dependencyResolutionManagement.repositories.isEmpty()) {
              patchRepos(settings.dependencyResolutionManagement.repositories, true)
            }
          }

          gradle.allprojects {
            buildscript {
              patchRepos(repositories, true)
            }
            patchRepos(repositories, false)
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --reporter compact

      - name: Build release APK
        run: |
          flutter build apk --release || (sleep 10 && flutter build apk --release)

      - name: Prepare APK artifact
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/kistas-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kistas-release-apk
          path: release-artifacts/kistas-release.apk
          retention-days: 30

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/kistas-release.apk
          generate_release_notes: true
